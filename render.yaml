# Render Blueprint. Connect https://github.com/DiptiKothari23/AgentShield and apply this file.
# The hosted agent is the mock model. Ollama and qwen3:4b do not fit a Render web service.
# API_KEY and DECISION_SECRET are generated on first sync. The dashboard reads the same API key.
services:
  - type: web
    name: agentshield-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: mock
      - key: API_KEY
        generateValue: true
      - key: DECISION_SECRET
        generateValue: true
      - key: AUDIT_DB_PATH
        value: /tmp/agentshield-audit.db
      - key: SANDBOX_DB_PATH
        value: /tmp/agentshield-sandbox.db
      - key: CORS_ORIGINS
        fromService:
          name: agentshield-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: agentshield-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: API_UPSTREAM_URL
        fromService:
          name: agentshield-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_KEY
        fromService:
          name: agentshield-api
          type: web
          envVarKey: API_KEY
