name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check backend tests
      - name: Test
        env:
          LLM_PROVIDER: mock
          API_KEY: ci-key
        run: pytest --cov=backend --cov-report=term-missing
