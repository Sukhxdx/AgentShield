[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "1.0.0"
description = "Governance layer that decides whether an LLM agent's tool call may run."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "gunicorn==26.2.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.15",
    "httpx==0.28.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "joblib==1.6.0",
    "pyyaml==6.0.3",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["**/*.yml", "**/*.yaml", "**/*.json", "ml/artifacts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "Header", "Query", "File", "Form", "Body"]

[tool.ruff.lint.per-file-ignores]
"backend/ml/generate_dataset.py" = ["E501"]
"backend/evaluation/test_cases.py" = ["E501"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/ml/generate_dataset.py", "backend/ml/train_risk_model.py"]
