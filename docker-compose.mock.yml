# Same API and dashboard as docker-compose.yml, with the mock agent instead of Ollama.
# Use this when the host cannot pull qwen3:4b.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:-dev-only-change-me}
      DECISION_SECRET: ${DECISION_SECRET:-dev-only-decision-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8742,http://localhost:8742}
      LLM_PROVIDER: mock
      AUDIT_DB_PATH: /data/audit.db
      SANDBOX_DB_PATH: /data/sandbox.db
    volumes:
      - audit:/data
    ports:
      - "8741:8741"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      API_UPSTREAM_URL: http://api:8741
      API_KEY: ${API_KEY:-dev-only-change-me}
      PORT: "8742"
    ports:
      - "8742:8742"
    depends_on:
      - api

volumes:
  audit:
